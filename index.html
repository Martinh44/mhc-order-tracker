<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>JC Sportline Orders · Vanté Automotive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracker.css">
</head>
<body>

<div class="pin" id="pin">
  <img src="https://cdn.shopify.com/s/files/1/0692/3475/3654/files/vante-logo-a6192e.png?v=1790154922&width=480" alt="Vanté Automotive">
  <h1 data-i="pinTitle"></h1>
  <input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN">
  <div class="err" id="pin-err"></div>
</div>

<header>
  <div class="bar">
    <div class="brand">
      <img src="https://cdn.shopify.com/s/files/1/0692/3475/3654/files/vante-logo-a6192e.png?v=1790154922&width=360" alt="Vanté Automotive">
      <span class="sep"></span><b><span class="lg" data-i="title"></span><span class="sh" data-i="titleShort"></span></b>
    </div>
    <div class="grow"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" aria-label="Search">
    </label>
    <div class="status" id="status"><span class="dot"></span><span class="txt"></span></div>
    <button class="icon-btn lang-btn" id="lang-btn"></button>
    <button class="icon-btn" id="sync-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="btn btn-red btn-new" id="new-btn">+ <span class="long" data-i="newOrder"></span></button>
  </div>
</header>

<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title"></aside>
<div class="toast" id="toast"></div>

<script>
// JC Sportline board. Data format, sync and storage keys are unchanged from the original tracker:
// the whole board is one KV blob ({orders, savedAt}) behind GET/PUT /orders, newest savedAt wins.
const WORKER_URL = 'https://mhc-api.raspy-fog-edb1.workers.dev';
const PROD = 2;
const DAY = 86400000;

const T = {
  zh: {
    langBtn: 'EN', pinTitle: 'JC Sportline 订单追踪', pinPH: '请输入 PIN 码', title: 'JC Sportline 订单', titleShort: 'JC Sportline',
    pinWrong: 'PIN 码错误', pinLocked: '尝试次数过多，请15分钟后再试', pinBlocked: '此设备已被永久封锁，请联系管理员',
    search: '搜索客户、零件、订单…', refresh: '从云端同步', newOrder: '新订单',
    connecting: '连接中…', syncing: '同步中…', synced: '已同步', offline: '离线', saveFailed: '保存失败',
    incoming: '待处理', stages: ['下单', '已付款', '生产中', '已发货', '已签收'],
    stIncoming: ['待处理', '待处理'], stOpen: ['进行中订单', '进行中'], stProd: ['生产中', '生产中'], stOld: ['超过30天未发货', '30天+'], oldFilter: '只看超过30天未发货的订单',
    emptyIncoming: 'Shopify 的 JC 订单会自动出现在这里', empty: '暂无订单',
    moreParts: n => `另有 ${n} 个零件`, tracking: '物流单号', days: '天',
    customer: '客户信息', order: '订单信息', progress: '进度', notes: '备注',
    name: '客户姓名', email: '邮箱', phone: '电话', address: '地址',
    partNumbers: '零件编号（每行一个）', trackingNo: '物流单号', createdDate: '创建日期',
    draftHint: '来自 Shopify 的新订单，选择一个阶段开始处理。',
    created: '创建', lastUpdated: '最后更新', dAgo: '天前',
    save: '保存', del: '删除', cancel: '取消', close: '关闭', savedToast: '已保存',
    delConfirm: id => `确认删除 ${id}？`, newOrderTitle: '新订单',
  },
  en: {
    langBtn: '中文', pinTitle: 'JC Sportline order tracker', pinPH: 'Enter PIN', title: 'JC Sportline Orders', titleShort: 'JC Sportline',
    pinWrong: 'Incorrect PIN', pinLocked: 'Too many attempts. Try again in 15 minutes.', pinBlocked: 'This device has been permanently blocked. Contact the administrator.',
    search: 'Search customer, part, order…', refresh: 'Pull latest from cloud', newOrder: 'New order',
    connecting: 'Connecting…', syncing: 'Syncing…', synced: 'Synced', offline: 'Offline', saveFailed: 'Save failed',
    incoming: 'Incoming', stages: ['Order Raised', 'Invoice Paid', 'In Production', 'Shipped', 'Delivered'],
    stIncoming: ['Incoming', 'Incoming'], stOpen: ['Open orders', 'Open'], stProd: ['In production', 'In prod'], stOld: ['30+ days, not shipped', '30d+'], oldFilter: 'Show only orders 30+ days old and not shipped',
    emptyIncoming: 'Shopify orders for JC parts land here', empty: 'No orders',
    moreParts: n => `+ ${n} more part${n > 1 ? 's' : ''}`, tracking: 'Tracking', days: 'd',
    customer: 'Customer', order: 'Order', progress: 'Progress', notes: 'Notes',
    name: 'Customer name', email: 'Email', phone: 'Phone', address: 'Address',
    partNumbers: 'Part numbers (one per line)', trackingNo: 'Tracking number', createdDate: 'Created date',
    draftHint: 'New from Shopify. Choose a stage to move it onto the board.',
    created: 'Created', lastUpdated: 'Last updated', dAgo: 'd ago',
    save: 'Save', del: 'Delete', cancel: 'Cancel', close: 'Close', savedToast: 'Saved',
    delConfirm: id => `Delete ${id}?`, newOrderTitle: 'New order',
  },
};

// Same localStorage keys and raw formats as the original page, so logged-in devices carry on as before
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let lang = ls.get('mhc-lang') || 'zh';
let orders = (() => { try { return JSON.parse(ls.get('mhc-orders') || '[]'); } catch { return []; } })();
let pin = ls.get('mhc-pin') || '';
let cid = null, editing = null, syncTimer = null, statusKey = ['', 'connecting'];
let tab = +(ls.get('mhc-tab') ?? 0), query = '', onlyOld = false;

const t = k => T[lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDateInput = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $('pin-in').placeholder = t('pinPH');
  $('q').placeholder = t('search');
  $('lang-btn').textContent = t('langBtn');
  $('sync-btn').title = $('sync-btn').ariaLabel = t('refresh');
  setStatus(...statusKey);
}
$('lang-btn').onclick = () => {
  if (editing) readForm();
  lang = lang === 'zh' ? 'en' : 'zh'; ls.set('mhc-lang', lang);
  applyLang(); render(); if (editing) drawDrawer();
};

// ── PIN ───────────────────────────────────────────────────────────────
async function verifyPin(p) {
  try {
    const r = await fetch(WORKER_URL + '/orders', { headers: { 'X-PIN': p } });
    if (r.ok) return 'ok';
    if (r.status === 429) {
      const body = await r.json().catch(() => ({}));
      return body.error === 'blocked' ? 'blocked' : 'locked';
    }
    return 'wrong';
  } catch { return 'offline'; }
}

function startBoard() { $('pin').classList.add('hidden'); render(); pullFromWorker(true); }

// ── Sync (unchanged logic) ────────────────────────────────────────────
function setStatus(kind, key) {
  statusKey = [kind, key];
  const s = $('status'); s.className = 'status ' + kind; s.querySelector('.txt').textContent = t(key);
}

async function pullFromWorker(silent) {
  if (!silent) setStatus('busy', 'syncing');
  try {
    const r = await fetch(WORKER_URL + '/orders?t=' + Date.now(), { headers: { 'X-PIN': pin } });
    if (!r.ok) throw new Error('auth');
    const data = await r.json();
    const remote = Array.isArray(data) ? data : (data.orders || []);
    const remoteSavedAt = data.savedAt || 0;
    const localSavedAt  = parseInt(ls.get('mhc-saved-at') || '0', 10);
    // Take whichever side is newer
    if (remoteSavedAt >= localSavedAt) {
      orders = remote;
      ls.set('mhc-orders', JSON.stringify(orders));
      ls.set('mhc-saved-at', String(remoteSavedAt));
    } else {
      await pushToWorker(localSavedAt, true);
    }
    setStatus('ok', 'synced');
    if (!editing) render();
  } catch {
    setStatus('err', 'offline');
  }
}

async function pushToWorker(savedAt, silent) {
  const ts = savedAt || Date.now();
  if (!silent) setStatus('busy', 'syncing');
  try {
    const r = await fetch(WORKER_URL + '/orders', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-PIN': pin },
      body: JSON.stringify({ savedAt: ts, orders }),
    });
    if (!r.ok) throw 0;
    if (!silent) setStatus('ok', 'synced');
  } catch {
    setStatus('err', 'saveFailed');
  }
}

function persist() {
  const now = Date.now();
  ls.set('mhc-orders', JSON.stringify(orders));
  ls.set('mhc-saved-at', String(now));
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushToWorker(now), 800);
}

// ── Helpers (unchanged logic) ─────────────────────────────────────────
function nextId() {
  if (!orders.length) return 'MHC-001';
  return 'MHC-' + String(Math.max(...orders.map(o => parseInt(o.id.slice(4), 10))) + 1).padStart(3, '0');
}
function colOf(o) { let s = 0; for (let i = 0; i < 5; i++) if (o.stages[i]) s = i; return s; }
function boardCol(o) { return o.draft ? -1 : colOf(o); }
function daysAgo(ts) {
  const a = new Date(ts), b = new Date();
  const aMid = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const bMid = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.floor((bMid - aMid) / DAY);
}
function bCls(d, shipped) { return shipped ? 'g' : d < 20 ? 'g' : d < 30 ? 'am' : 'rd'; }
function ageOf(o) { return daysAgo(o.createdAt || o.lastUpdated); }
function isOld(o) { return !o.draft && colOf(o) < 3 && bCls(ageOf(o), false) === 'rd'; }
function fmtDate(ts) {
  const d = new Date(ts);
  return lang === 'zh' ? `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`
    : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
const partsOf = o => (o.partNumbers || '').split('\n').map(s => s.trim()).filter(Boolean);

// ── Render ────────────────────────────────────────────────────────────
function matches(o) {
  if (onlyOld && !isOld(o)) return false;
  if (!query) return true;
  const hay = [o.id, o.shopifyOrderName, o.customerName, o.email, o.phone, o.tracking, o.notes, o.partNumbers].join(' ').toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function cardHtml(o) {
  const d = ageOf(o), shipped = !o.draft && colOf(o) >= 3, parts = partsOf(o);
  return `<article class="card${o.draft ? ' draft' : ''}" draggable="true" tabindex="0" data-id="${esc(o.id)}">
    <div class="c-top"><span class="c-id">${esc(o.id)}</span>${o.shopifyOrderName ? `<span class="c-shop">${esc(o.shopifyOrderName)}</span>` : ''}
      <span class="c-age ${bCls(d, shipped)}" title="${esc(t('created') + ' ' + fmtDate(o.createdAt || o.lastUpdated))}">${d}${t('days')}</span></div>
    ${o.customerName ? `<div class="c-name">${esc(o.customerName)}</div>` : ''}
    ${parts.length ? `<div class="c-lines">${parts.slice(0, 2).map(p => `<div>${esc(p)}</div>`).join('')}</div>` : ''}
    ${parts.length > 2 ? `<div class="c-more">${esc(t('moreParts')(parts.length - 2))}</div>` : ''}
    ${o.tracking && shipped ? `<div class="c-track">${esc(t('tracking'))} ${esc(o.tracking)}</div>` : ''}
  </article>`;
}

const statLabel = ([lg, sh]) => `<span><i class="lg">${esc(lg)}</i><i class="sh">${esc(sh)}</i></span>`;

function render() {
  const cols = [{ key: -1, name: t('incoming') }, ...t('stages').map((name, key) => ({ key, name }))];
  const by = new Map(cols.map(c => [c.key, []]));
  orders.filter(matches).forEach(o => by.get(boardCol(o))?.push(o));

  const oldN = orders.filter(isOld).length;
  $('stats').innerHTML =
    `<div class="stat">${statLabel(t('stIncoming'))}<b>${orders.filter(o => o.draft).length}</b></div>
     <div class="stat">${statLabel(t('stOpen'))}<b>${orders.filter(o => !o.draft && colOf(o) < 4).length}</b></div>
     <div class="stat">${statLabel(t('stProd'))}<b>${orders.filter(o => !o.draft && colOf(o) === PROD).length}</b></div>
     <button class="stat${oldN ? ' late' : ''}${onlyOld ? ' active' : ''}" id="old-filter" title="${esc(t('oldFilter'))}">${statLabel(t('stOld'))}<b>${oldN}</b></button>`;
  $('old-filter').onclick = () => { onlyOld = !onlyOld; render(); };

  $('tabs').innerHTML = cols.map(c => {
    const list = by.get(c.key), hasOld = list.some(isOld);
    return `<button class="tab${tab === c.key ? ' active' : ''}${hasOld ? ' has-late' : ''}" data-tab="${c.key}">${esc(c.name)}<b>${list.length}</b></button>`;
  }).join('');
  $('tabs').querySelector('.tab.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });

  $('board').innerHTML = cols.map(c => {
    const list = by.get(c.key);
    const cls = c.key === -1 ? ' incoming' : c.key === PROD ? ' prod' : '';
    const empty = c.key === -1 ? t('emptyIncoming') : t('empty');
    return `<section class="col${cls}${tab === c.key ? ' show' : ''}">
      <div class="col-hd"><span class="pip"></span><h2>${esc(c.name)}</h2><span class="n">${list.length}</span></div>
      <div class="col-bd" data-col="${c.key}">${list.length ? list.map(cardHtml).join('') : `<div class="empty">${esc(empty)}</div>`}</div>
    </section>`;
  }).join('');
}

// ── Board events ──────────────────────────────────────────────────────
$('board').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openModal(c.dataset.id); });
$('board').addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && e.key === 'Enter') openModal(c.dataset.id); });
$('board').addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if (!c) return;
  e.dataTransfer.setData('text', c.dataset.id);
  requestAnimationFrame(() => c.classList.add('dragging'));
});
$('board').addEventListener('dragend', e => e.target.closest('.card')?.classList.remove('dragging'));
$('board').addEventListener('dragover', e => {
  const bd = e.target.closest('.col-bd'); if (!bd || bd.dataset.col === '-1') return;
  e.preventDefault(); document.querySelectorAll('.col-bd.over').forEach(x => x !== bd && x.classList.remove('over')); bd.classList.add('over');
});
$('board').addEventListener('dragleave', e => { const bd = e.target.closest('.col-bd'); if (bd && !bd.contains(e.relatedTarget)) bd.classList.remove('over'); });
$('board').addEventListener('drop', e => {
  const bd = e.target.closest('.col-bd'); if (!bd || bd.dataset.col === '-1') return;
  e.preventDefault(); bd.classList.remove('over');
  const o = orders.find(x => x.id === e.dataTransfer.getData('text')); if (!o) return;
  const s = +bd.dataset.col;
  o.draft = false;
  for (let i = 0; i <= s; i++) o.stages[i] = true;
  for (let i = s + 1; i < 5; i++) o.stages[i] = false;
  o.lastUpdated = Date.now(); persist(); render();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { tab = +b.dataset.tab; ls.set('mhc-tab', String(tab)); render(); } });
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('sync-btn').onclick = () => pullFromWorker(false);
$('new-btn').onclick = () => openModal(null);

// ── Order editor ──────────────────────────────────────────────────────
const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>';

function openModal(id) {
  const o = id ? orders.find(x => x.id === id) : null;
  if (id && !o) return;
  cid = id;
  editing = o ? { ...o, stages: [...o.stages] } : { customerName: '', email: '', phone: '', address: '', partNumbers: '', tracking: '', notes: '',
    stages: [false, false, false, false, false], createdAt: Date.now() };
  drawDrawer();
  $('scrim').classList.add('open'); $('drawer').classList.add('open');
  setTimeout(() => $('f-name')?.focus(), 50);
}

function closeModal() { $('scrim').classList.remove('open'); $('drawer').classList.remove('open'); cid = null; editing = null; render(); }

function readForm() {
  if (!editing || !$('f-name')) return;
  const v = id => $(id).value;
  Object.assign(editing, { customerName: v('f-name'), email: v('f-email'), phone: v('f-phone'), address: v('f-addr'),
    partNumbers: v('f-parts'), tracking: v('f-track'), notes: v('f-notes'), createdDraft: v('f-created') });
}

// Same cascade as the original checkboxes: ticking a stage ticks the ones before it, unticking clears it and the ones after
function onStage(i) {
  const on = !editing.stages[i] || i !== colOf(editing) || editing.stages.slice(i + 1).some(Boolean);
  for (let j = 0; j < 5; j++) {
    if (on && j <= i) editing.stages[j] = true;
    if (on && j > i) editing.stages[j] = false;
    if (!on && j >= i) editing.stages[j] = false;
  }
}

function drawDrawer() {
  const o = editing, names = t('stages'), anyStage = o.stages.some(Boolean), cur = anyStage ? colOf(o) : -1;
  const steps = names.map((name, i) => {
    const done = o.stages[i];
    return `<div class="step${done ? ' done' : ''}${done && i === cur ? ' cur' : ''}">
      <span class="c">${done ? check : ''}</span><div><button class="lab" data-step="${i}">${esc(name)}</button></div><span></span></div>`;
  }).join('');
  const createdTs = o.createdAt || o.lastUpdated || Date.now();
  let meta = '';
  if (cid) {
    const cr = o.createdAt ? `${t('created')}: ${fmtDate(o.createdAt)}  ·  ` : '';
    meta = `${cr}${t('lastUpdated')}: ${fmtDate(o.lastUpdated)} (${daysAgo(o.lastUpdated)}${t('dAgo')})`;
  }
  $('drawer').innerHTML = `
    <div class="d-hd"><div><h3 id="d-title">${esc(cid || t('newOrderTitle'))}</h3>
      <div class="sub">${o.shopifyOrderName ? 'Shopify ' + esc(o.shopifyOrderName) + ' · ' : ''}${esc(o.draft && !anyStage ? t('incoming') : names[Math.max(cur, 0)])}</div></div>
      <div class="grow"></div><button class="icon-btn" id="d-close" aria-label="${esc(t('close'))}">✕</button></div>
    <div class="d-bd">
      <div class="sec"><h4>${esc(t('customer'))}</h4><div class="grid">
        <label class="f"><span>${esc(t('name'))}</span><input class="in" id="f-name" value="${esc(o.customerName)}"></label>
        <div class="grid g2"><label class="f"><span>${esc(t('email'))}</span><input class="in" id="f-email" type="email" value="${esc(o.email)}"></label>
        <label class="f"><span>${esc(t('phone'))}</span><input class="in" id="f-phone" type="tel" value="${esc(o.phone)}"></label></div>
        <label class="f"><span>${esc(t('address'))}</span><textarea class="in" id="f-addr" rows="2">${esc(o.address)}</textarea></label></div></div>
      <div class="sec"><h4>${esc(t('order'))}</h4><div class="grid">
        <label class="f"><span>${esc(t('partNumbers'))}</span><textarea class="in" id="f-parts" rows="3">${esc(o.partNumbers)}</textarea></label>
        <div class="grid g2"><label class="f"><span>${esc(t('trackingNo'))}</span><input class="in" id="f-track" value="${esc(o.tracking)}"></label>
        <label class="f"><span>${esc(t('createdDate'))}</span><input class="in" id="f-created" type="date" value="${esc(o.createdDraft || toDateInput(createdTs))}"></label></div></div></div>
      <div class="sec"><h4>${esc(t('progress'))}</h4>${o.draft && !anyStage ? `<div class="hint" style="margin-bottom:8px">${esc(t('draftHint'))}</div>` : ''}<div class="steps">${steps}</div></div>
      <div class="sec"><h4>${esc(t('notes'))}</h4><textarea class="in" id="f-notes" rows="3">${esc(o.notes)}</textarea></div>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
    </div>
    <div class="d-ft">${cid ? `<button class="btn btn-text" id="d-del">${esc(t('del'))}</button>` : ''}
      <div class="grow"></div><button class="btn btn-ghost" id="d-cancel">${esc(t('cancel'))}</button><button class="btn btn-red" id="d-save">${esc(t('save'))}</button></div>`;

  $('d-close').onclick = $('d-cancel').onclick = closeModal;
  $('d-save').onclick = saveOrder;
  if ($('d-del')) $('d-del').onclick = delOrder;
  $('drawer').querySelectorAll('[data-step]').forEach(b => b.onclick = () => { readForm(); onStage(+b.dataset.step); drawDrawer(); });
}

function saveOrder() {
  readForm();
  const now = Date.now();
  const fields = {
    customerName: editing.customerName.trim(),
    email:        editing.email.trim(),
    phone:        editing.phone.trim(),
    address:      editing.address.trim(),
    partNumbers:  editing.partNumbers.trim(),
    tracking:     editing.tracking.trim(),
    notes:        editing.notes,
    stages:       [...editing.stages],
    lastUpdated:  now,
    createdAt:    new Date(editing.createdDraft).getTime() || now,
  };
  if (cid) {
    const existing = orders.find(x => x.id === cid);
    const wasDraft = existing?.draft;
    Object.assign(existing, fields);
    if (wasDraft && fields.stages.some(Boolean)) existing.draft = false;
  } else { orders.push({ id: nextId(), ...fields }); }
  persist(); closeModal(); toast(t('savedToast'));
}

function delOrder() {
  if (!cid || !confirm(t('delConfirm')(cid))) return;
  orders = orders.filter(x => x.id !== cid); persist(); closeModal();
}

$('scrim').onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) closeModal(); });

let toastTimer;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }

// ── Start ─────────────────────────────────────────────────────────────
applyLang();
(function initPin() {
  const input = $('pin-in'), err = $('pin-err');
  if (pin) {
    verifyPin(pin).then(res => {
      if (res === 'ok' || res === 'offline') { startBoard(); return; }
      if (res === 'wrong') { pin = ''; ls.del('mhc-pin'); }   // PIN was changed: ask again
      input.focus();
    });
  } else input.focus();
  input.addEventListener('input', async () => {
    err.textContent = '';
    input.value = input.value.replace(/\D/g, '');
    if (input.value.length < 6) return;
    const candidate = input.value.trim();
    const res = await verifyPin(candidate);
    if (res === 'ok') { pin = candidate; ls.set('mhc-pin', pin); startBoard(); }
    else if (res === 'locked') { err.textContent = t('pinLocked'); input.disabled = true; }
    else if (res === 'blocked') { err.textContent = t('pinBlocked'); input.disabled = true; }
    else { err.textContent = t('pinWrong'); input.value = ''; input.focus(); }
  });
})();
</script>
</body>
